# Playbook do Antora -- e o arquivo que o construtor do Showroom procura
# (ANTORA_SITE_FILE no chart de deploy/).
#
# 'url: .' e 'start_page' apontam para o proprio site: o Showroom serve o
# conteudo estatico direto, sem CDN e sem base href externo.
site:
  title: Workshop — Do repositório ao produto de API
  start_page: modules::index.adoc
  robots: disallow

content:
  sources:
    - url: .
      branches: HEAD
      start_path: content

ui:
  bundle:
    url: https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.1/nookbag-v0.2.1.zip
    snapshot: true

runtime:
  fetch: true
  log:
    failure_level: warn

output:
  dir: ./www

asciidoc:
  attributes:
    experimental: ''
    source-highlighter: rouge
