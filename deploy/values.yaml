# ===========================================================================
# Chart do workshop para o CI *Field Content* da RHDP.
#
# O contrato do ocp4_workload_field_content e curto: uma Application do Argo
# apontando para este repositorio, e estes valores injetados na hora:
#
#   deployer.domain / deployer.apiUrl     sempre
#   gitops.repoURL / revision / path      o repositorio que o CI recebeu
#   litemaas.*, multi_user.*              quando o catalogo os fornece
#
# NAO ESCREVA HOSTNAME AQUI. O cluster e efemero e o dominio chega por
# deployer.domain, resolvido no momento do provisionamento.
# ===========================================================================

# ---------------------------------------------------------------- injetados
# Ficam vazios de proposito: quem preenche e o workload, no provisionamento.
deployer:
  domain: ""
  apiUrl: ""

# ATENCAO AO 'URL' MAIUSCULO. O role injeta 'gitops.repoURL'; o exemplo do
# template declara 'gitops.repoUrl' e por isso NAO recebe a injecao -- quem
# forka e nao troca a linha a mao sobe o conteudo do repositorio upstream, sem
# erro nenhum. Aqui usamos o nome que o role escreve.
gitops:
  repoURL: ""
  revision: "main"
  path: ""

# ------------------------------------------------------------------ showroom
showroom:
  enabled: true
  name: showroom
  namespace: showroom

  content:
    # Vazio = usa gitops.repoURL, ou seja, ESTE repositorio. O guia e o chart
    # moram juntos, entao a versao do guia acompanha a do deploy sozinha.
    repoUrl: ""
    repoRef: ""
    antoraPlaybook: "site.yml"
    image: "quay.io/rhpds/showroom-content:v1.3.1"

  nookbag:
    enabled: true
    bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.1/nookbag-v0.2.1.zip"

  terminal:
    enabled: true
    # A IMAGEM DO TERMINAL E O UNICO PONTO DE ATENCAO DESTE CHART.
    #
    # Os quatro verbos do workshop (verifica/diagnostica/corrige/pula) rodam
    # playbooks Ansible com a collection kubernetes.core. A imagem padrao do
    # Showroom traz 'oc' e 'git', mas nao garante Ansible.
    #
    # O scripts/workshop.sh detecta a ausencia e INSTALA o Ansible no home do
    # participante (que e PVC), uma vez, na primeira verificacao. Apontar aqui
    # uma imagem que ja tenha Ansible evita essa espera de ~1 minuto.
    image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
    resources:
      requests: {cpu: "500m", memory: "512Mi"}
      limits:   {cpu: "1",    memory: "1Gi"}
    homeStorage: "5Gi"


# ------------------------------------------------------------------ userinfo
# ConfigMap com o label que a RHDP le para mostrar dados ao participante.
userinfo:
  enabled: true
  title: "Workshop — Do repositório ao produto de API"
  instructions: >-
    Abra o guia do laboratório e siga a partir de "Seu ambiente". O terminal
    fica na aba ao lado; todo comando do dia sai de lá.

# ---------------------------------------------------------------- plataforma
# O CI Field Content entrega um cluster com RHBK, Lightspeed e OpenShift GitOps
# -- e mais nada. Tudo o que o workshop pressupoe e montado por um Job, na ordem
# de docs/PROVISIONING-1.4.md.
plataforma:
  enabled: true

  # completo  Service Mesh + Connectivity Link + Pipelines + portal + GitLab,
  #           Quay, ACS e RHTAS. Libera os modulos 1.4 e 1.5. LENTO e pesado.
  # leve      sem GitLab/Quay/ACS: os modulos 1.4 e 1.5 ficam indisponiveis.
  perfil: completo

  # check  nao instala nada; diz o que falta e em que ordem. Use no primeiro
  #        provisionamento de um cluster que voce nao montou.
  modo: apply

  repo:
    url: "https://github.com/devhub-tanaka/rhcl-connectivity-demo"
    ref: "main"
    # O repositorio da plataforma e PRIVADO. Sem token, o Job para com uma
    # mensagem dizendo isso -- e nao com 'could not read Username', que fala de
    # terminal e manda depurar o lado errado.
    #
    # Nome do secret com o PAT de leitura. E 'optional: true' no pod, entao
    # apontar um secret que ainda nao existe nao quebra nada -- o download
    # simplesmente falha com a mensagem que explica o que fazer.
    #
    # Deixe vazio para o Job usar o secret que a propria RHDP cria quando voce
    # marca "repositorio privado" no formulario do pedido.
    tokenSecret: "plataforma-git"
    tokenKey: "password"

  # A imagem do cluster tem oc, python3, curl, openssl e tar -- e NAO tem git.
  # Por isso o repositorio vem por tarball, o que de quebra resolve o caso do
  # repositorio privado sem precisar de credential helper.
  image: "image-registry.openshift-image-registry.svc:5000/openshift/cli:latest"

  # O perfil completo sobe GitLab, Quay e ACS. Nao e exagero: cada um traz
  # banco proprio.
  timeoutSegundos: 14400
  recursos:
    requests: {cpu: "200m", memory: "512Mi"}
    limits:   {cpu: "2",    memory: "2Gi"}
