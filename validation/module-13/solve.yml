---
# 1.3 PULA: dispara uma execucao de valida-policies e espera terminar.
- name: "1.3 — pula (uma execucao concluida)"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Criar a PipelineRun"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: tekton.dev/v1
          kind: PipelineRun
          metadata:
            generateName: valida-policies-run-
            namespace: travel-agency
          spec:
            pipelineRef: {name: valida-policies}
            workspaces:
              - name: fonte
                volumeClaimTemplate:
                  spec:
                    accessModes: [ReadWriteOnce]
                    resources: {requests: {storage: 1Gi}}
      register: r_run

    - name: "Esperar a execucao terminar"
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: travel-agency
        name: "{{ r_run.result.metadata.name }}"
      register: r_pr
      until: r_pr.resources[0].status.completionTime is defined
      retries: 30
      delay: 10
