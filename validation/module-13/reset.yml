---
# 1.3 CORRIGE: volta a origem das imagens para o upstream.
#
# O jeito mais confiavel de restaurar um arquivo versionado nao e desfazer a
# edicao com regex -- e pedir ao git a versao original. O repositorio da
# plataforma e um clone, entao 'checkout --' devolve exatamente o padrao.
- name: "1.3 — corrige (origem no upstream)"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Restaurar o kustomization da amostra"
      ansible.builtin.command:
        cmd: git checkout -- samples/bookinfo/kustomization.yaml
        chdir: "{{ lookup('env','HOME') }}/rhcl"
      changed_when: true

    - name: "Reaplicar a amostra"
      ansible.builtin.command:
        cmd: bash scripts/provision.sh samples
        chdir: "{{ lookup('env','HOME') }}/rhcl"
      environment: {SAMPLES: bookinfo}
      changed_when: true

    - name: "Pronto"
      ansible.builtin.debug:
        msg: "Origem de volta no upstream. As copias no Quay continuam la."
