---
- name: "1.3 — o modelo do Tekton foi exercitado"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "As pipelines do cluster"
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: Pipeline
      register: r_pipes
      ignore_errors: true

    - name: "As execucoes de valida-policies"
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: travel-agency
      register: r_runs
      ignore_errors: true

    - name: "As TaskRun que elas criaram"
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: TaskRun
        namespace: travel-agency
      register: r_taskruns
      ignore_errors: true

    - name: "Consolidar"
      ansible.builtin.set_fact:
        _t1: "{{ r_pipes.resources | default([]) | length > 0 }}"
        _t2: "{{ r_runs.resources | default([]) | length > 0 }}"
        _t3: "{{ r_taskruns.resources | default([]) | length > 0 }}"

    - name: "Resultado"
      ansible.builtin.assert:
        that: [_t1 | bool, _t2 | bool, _t3 | bool]
        success_msg: |
          OK {{ r_pipes.resources | length }} Pipeline no cluster
          OK {{ r_runs.resources | length }} PipelineRun em travel-agency
          OK {{ r_taskruns.resources | length }} TaskRun — cada uma virou um pod
        fail_msg: |
          {{ 'OK  ' if _t1 else 'FALHOU' }} Pipelines no cluster: {{ r_pipes.resources | default([]) | length }}
          {{ 'OK  ' if _t2 else 'FALHOU' }} PipelineRun em travel-agency: {{ r_runs.resources | default([]) | length }}
          {{ 'OK  ' if _t3 else 'FALHOU' }} TaskRun geradas: {{ r_taskruns.resources | default([]) | length }}

          Sem CRD de Tekton, o OpenShift Pipelines nao esta instalado:
            oc get crd pipelineruns.tekton.dev
          PipelineRun presa em Pending costuma ser o workspace -- o
          volumeClaimTemplate precisa de uma StorageClass ReadWriteOnce:
            oc get pvc -n travel-agency
