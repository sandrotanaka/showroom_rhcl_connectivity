---
- name: "Ambiente — a plataforma esta de pe"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Tarefa 1 — o gateway da plataforma existe
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: prod-web
        namespace: ingress-gateway
      register: r_gw

    - name: Tarefa 2 — o Connectivity Link respondeu pelas CRDs
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: planpolicies.extensions.kuadrant.io
      register: r_crd

    - name: Tarefa 3 — o Service Mesh esta instalado
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: peerauthentications.security.istio.io
      register: r_pa

    - name: Resultado
      ansible.builtin.assert:
        that:
          - r_gw.resources | length > 0
          - r_crd.resources | length > 0
          - r_pa.resources | length > 0
        success_msg: |
          OK Gateway prod-web presente
          OK Connectivity Link (PlanPolicy) presente
          OK Service Mesh presente
        fail_msg: |
          {{ 'OK  ' if r_gw.resources | length > 0 else 'FALHOU' }} Gateway prod-web
          {{ 'OK  ' if r_crd.resources | length > 0 else 'FALHOU' }} CRD de PlanPolicy
          {{ 'OK  ' if r_pa.resources | length > 0 else 'FALHOU' }} CRD de PeerAuthentication

          Rode o verificador completo, que diz o que falta e como corrigir:
            bash ~/rhcl/scripts/preflight.sh
