---
# Modulo 1 -- A API esta fechada por padrao
# Derivado de scripts/preflight.sh (secao 'caminho de dados' do repo da demo).
- name: "Modulo 1 — a API esta fechada por padrao"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Descobrir o hostname da API a partir do cluster
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: travel-agency
        namespace: travel-agency
      register: r_route

    - name: Tarefa 1 — a AuthPolicy da rota esta Enforced
      kubernetes.core.k8s_info:
        api_version: kuadrant.io/v1
        kind: AuthPolicy
        name: travel-agency-authpolicy
        namespace: travel-agency
      register: r_auth

    - name: Tarefa 2 — requisicao sem chave e recusada com 401
      ansible.builtin.uri:
        url: "https://{{ r_route.resources[0].spec.hostnames[0] }}/travels"
        validate_certs: false
        status_code: [401, 403]
      register: r_anon

    - name: Consolidar
      ansible.builtin.set_fact:
        _t1: "{{ (r_auth.resources | default([]) | length > 0) and
                 (r_auth.resources[0].status.conditions
                  | selectattr('type','equalto','Enforced')
                  | selectattr('status','equalto','True') | list | length > 0) }}"
        _t2: "{{ r_anon.status == 401 }}"

    - name: Resultado
      ansible.builtin.assert:
        that:
          - _t1 | bool
          - _t2 | bool
        success_msg: |
          OK Tarefa 1: AuthPolicy travel-agency-authpolicy Accepted+Enforced
          OK Tarefa 2: requisicao sem chave recusada com 401 pelo gateway
        fail_msg: |
          {{ 'OK  ' if _t1 else 'FALHOU' }} Tarefa 1: AuthPolicy Enforced
          {{ 'OK  ' if _t2 else 'FALHOU' }} Tarefa 2: 401 sem chave (recebido: {{ r_anon.status }})

          Corrija:
            oc apply -k overlays/rhcl-1.4
            bash scripts/preflight.sh core
          Se recebeu 500 em vez de 401, o Authorino caiu -- a policy nao tem culpa:
            oc get pods -n kuadrant-system -l app=authorino
