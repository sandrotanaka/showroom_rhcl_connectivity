---
- name: "1.1 — a aplicacao subiu pelo GitOps"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Tarefa 1 — os seis pods estao Running com sidecar (2/2)
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: bookinfo
        field_selectors: [status.phase=Running]
      register: r_pods

    - name: Tarefa 2 — o ApplicationSet governa as amostras
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: ApplicationSet
        namespace: openshift-gitops
      register: r_appset
      ignore_errors: true

    # CONTAR PELO istio-proxy NOS initContainers, e nao por spec.containers.
    #
    # O sidecar aqui e NATIVO: o istio-proxy e um initContainer com
    # restartPolicy Always. Com o Service Mesh funcionando, spec.containers diz
    # 1 -- e o 2/2 do 'oc get' vem do READY, que conta o sidecar nativo.
    # Contar pelo spec da zero e manda conferir o label de injecao, que esta
    # certo. E a armadilha 5.5 do CONHECIMENTO, e eu cai nela.
    - name: Contar os pods com sidecar injetado
      ansible.builtin.set_fact:
        _n_sidecar: "{{ _n_sidecar | default(0) | int + 1 }}"
      loop: "{{ r_pods.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: "'istio-proxy' in (item.spec.initContainers | default([]) | map(attribute='name') | list)"

    - name: Resultado
      ansible.builtin.assert:
        that:
          - _n_sidecar | default(0) | int >= 6
          - r_appset.resources | default([]) | length > 0
        success_msg: |
          OK {{ _n_sidecar | default(0) }} pods com o sidecar injetado
          OK ApplicationSet presente — quem aplica daqui em diante e o Argo
        fail_msg: |
          {{ 'OK  ' if _n_sidecar | default(0) | int >= 6 else 'FALHOU' }} pods com sidecar: {{ _n_sidecar | default(0) }}
          {{ 'OK  ' if r_appset.resources | default([]) | length > 0 else 'FALHOU' }} ApplicationSet em openshift-gitops

          Suba a amostra:
            cd ~/rhcl && SAMPLES=bookinfo bash scripts/provision.sh samples
          Sem sidecar, confira o label do NAMESPACE (annotation de pod nao injeta):
            oc get ns bookinfo --show-labels
