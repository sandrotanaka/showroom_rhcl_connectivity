---
- name: "3.5 — metrica quebrada por plano"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "A TelemetryPolicy do gateway"
      kubernetes.core.k8s_info:
        api_version: extensions.kuadrant.io/v1alpha1
        kind: TelemetryPolicy
        namespace: ingress-gateway
      register: r_tel

    - name: "Descobrir a rota do Thanos"
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: thanos-querier
        namespace: openshift-monitoring
      register: r_thanos

    - name: "Obter o token da sessao"
      ansible.builtin.command: oc whoami -t
      register: r_token
      changed_when: false

    - name: "Consultar o consumo por plano"
      ansible.builtin.uri:
        url: "https://{{ r_thanos.resources[0].spec.host }}/api/v1/query?query={{ 'sum by (plan) (authorized_calls)' | urlencode }}"
        headers: {Authorization: "Bearer {{ r_token.stdout }}"}
        validate_certs: false
      register: r_q

    - name: "Consolidar"
      ansible.builtin.set_fact:
        _planos: "{{ r_q.json.data.result | default([]) | map(attribute='metric.plan') | select('defined') | unique | list }}"
    - name: "Consolidar (2)"
      ansible.builtin.set_fact:
        _t1: "{{ r_tel.resources | default([]) | length > 0 }}"
        _t2: "{{ _planos | length > 0 }}"

    - name: "Resultado"
      ansible.builtin.assert:
        that: [_t1 | bool, _t2 | bool]
        success_msg: |
          OK TelemetryPolicy no gateway (nesta release o alvo so pode ser Gateway)
          OK Thanos responde por plano: {{ _planos | join(' ') }}
        fail_msg: |
          {{ 'OK  ' if _t1 else 'FALHOU' }} TelemetryPolicy em ingress-gateway
          {{ 'OK  ' if _t2 else 'FALHOU' }} series com o label 'plan'

          Sem serie nenhuma, a coleta ainda nao aconteceu -- gere trafego pela
          API com as tres chaves e espere um minuto.
          Uma TelemetryPolicy mirando HTTPRoute e RECUSADA pelo servidor nesta
          release: o unico alvo suportado e Gateway.
