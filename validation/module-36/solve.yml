---
# 3.6 PULA: recria o RESULTADO do golden path no cluster.
#
# O QUE ISTO NAO FAZ: nao cria repositorio no Git, nao abre PR e nao registra a
# entidade no catalogo. Quem pular o modulo nao vera o componente no portal --
# e e correto que nao veja, porque essa parte E o golden path.
#
# A imagem do workload e DESCOBERTA do cluster; digest escrito em arquivo
# envelhece junto com o cluster, que e efemero.
- name: "3.6 — pula (o resultado do golden path)"
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ns: workshop-api
  tasks:
    - name: "Descobrir dominio e uma imagem ja presente"
      kubernetes.core.k8s_info: {api_version: config.openshift.io/v1, kind: Ingress, name: cluster}
      register: r_ing
    - name: "Imagem de referencia"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: bookinfo
        label_selectors: [app=details]
      register: r_img

    - name: "Namespace ja no Service Mesh, com identidade propria"
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - {apiVersion: v1, kind: Namespace,
           metadata: {name: "{{ ns }}", labels: {istio-injection: enabled}}}
        - {apiVersion: v1, kind: ServiceAccount,
           metadata: {name: "{{ ns }}", namespace: "{{ ns }}"}}
        - apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata: {name: "{{ ns }}-mtls", namespace: "{{ ns }}"}
          spec: {mtls: {mode: STRICT}}

    - name: "Workload e Service"
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - apiVersion: apps/v1
          kind: Deployment
          metadata: {name: "{{ ns }}", namespace: "{{ ns }}", labels: {app: "{{ ns }}"}}
          spec:
            replicas: 1
            selector: {matchLabels: {app: "{{ ns }}"}}
            template:
              metadata: {labels: {app: "{{ ns }}"}}
              spec:
                serviceAccountName: "{{ ns }}"
                containers:
                  - name: api
                    image: "{{ r_img.resources[0].spec.template.spec.containers[0].image }}"
                    ports: [{containerPort: 9080}]
        - apiVersion: v1
          kind: Service
          metadata: {name: "{{ ns }}", namespace: "{{ ns }}"}
          spec:
            selector: {app: "{{ ns }}"}
            ports: [{port: 9080, targetPort: 9080}]

    - name: "Rota no gateway da plataforma, com policy propria"
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop:
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata: {name: "{{ ns }}", namespace: "{{ ns }}"}
          spec:
            parentRefs: [{name: prod-web, namespace: ingress-gateway}]
            hostnames: ["{{ ns }}.{{ r_ing.resources[0].spec.domain }}"]
            rules: [{backendRefs: [{name: "{{ ns }}", port: 9080}]}]
        - apiVersion: kuadrant.io/v1
          kind: AuthPolicy
          metadata: {name: "{{ ns }}-authpolicy", namespace: "{{ ns }}"}
          spec:
            targetRef: {group: gateway.networking.k8s.io, kind: HTTPRoute, name: "{{ ns }}"}
            rules:
              authentication:
                api-key-authn:
                  apiKey: {selector: {matchLabels: {app: partner}}}
                  credentials: {queryString: {name: APIKEY}}

    - name: "Explicar o que ficou de fora"
      ansible.builtin.debug:
        msg: |
          A API existe em {{ ns }}, no Service Mesh, com policy de borda.
          NAO ha repositorio no Git nem entidade no catalogo -- isso o golden
          path faz, e voce pulou.
