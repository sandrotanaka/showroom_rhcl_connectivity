---
# 1.2 PULA: dispara a cadeia de suprimento sem passar pelo portal.
#
# Uma execucao POR IMAGEM -- o bookinfo tem seis, entao isto demora. E o unico
# 'pula' do dia que leva minutos, e e por isso que ele existe: quem nao quiser
# esperar pela cadeia ainda precisa do resultado dela para o modulo 1.3.
- name: "1.2 — pula (cadeia executada)"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "Disparar a cadeia pelo provisionador"
      ansible.builtin.command:
        cmd: bash scripts/provision.sh samples
        chdir: "{{ lookup('env','HOME') }}/rhcl"
      environment:
        SAMPLES: bookinfo
        DISPARA_BUILD: "1"
      changed_when: true

    - name: "Esperar as execucoes terminarem"
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: bookinfo
      register: r_prs
      until: >-
        r_prs.resources | default([]) | length > 0 and
        (r_prs.resources | selectattr('status.completionTime','defined') | list | length)
          == (r_prs.resources | length)
      retries: 60
      delay: 20
