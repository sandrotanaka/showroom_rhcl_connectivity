---
- name: "1.2 — a cadeia de suprimento executou e assinou"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Tarefa 1 — houve PipelineRun na amostra
      kubernetes.core.k8s_info:
        api_version: tekton.dev/v1
        kind: PipelineRun
        namespace: bookinfo
      register: r_prs
      ignore_errors: true

    - name: Consolidar
      ansible.builtin.set_fact:
        _runs: "{{ r_prs.resources | default([]) }}"
    - name: Consolidar (2)
      ansible.builtin.set_fact:
        _ok: "{{ _runs | selectattr('status.conditions','defined')
                 | selectattr('status.conditions.0.status','equalto','True') | list }}"
        _assinadas: "{{ _runs | map(attribute='metadata.annotations') | select('defined')
                        | selectattr('chains.tekton.dev/signed','defined') | list }}"

    - name: Resultado
      ansible.builtin.assert:
        that:
          - _runs | length > 0
          - _ok | length > 0
          - _assinadas | length > 0
        success_msg: |
          OK {{ _runs | length }} execucao(oes) da cadeia, {{ _ok | length }} bem-sucedida(s)
          OK {{ _assinadas | length }} assinada(s) pelo Tekton Chains
        fail_msg: |
          {{ 'OK  ' if _runs | length > 0 else 'FALHOU' }} PipelineRun em bookinfo: {{ _runs | length }}
          {{ 'OK  ' if _ok | length > 0 else 'FALHOU' }} alguma execucao bem-sucedida
          {{ 'OK  ' if _assinadas | length > 0 else 'FALHOU' }} alguma execucao assinada

          Dispare a cadeia:
            cd ~/rhcl && DISPARA_BUILD=1 SAMPLES=bookinfo bash scripts/provision.sh samples
          Sem anotacao de assinatura, o controller do Chains subiu antes da chave:
            oc rollout restart deployment/tekton-chains-controller -n openshift-pipelines
