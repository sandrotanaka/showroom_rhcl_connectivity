---
- name: "1.2 — o Argo governa, e o desvio foi devolvido"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: "O ApplicationSet que gera as Applications"
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: ApplicationSet
        namespace: openshift-gitops
      register: r_appset

    - name: "As Applications geradas"
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        namespace: openshift-gitops
      register: r_apps

    - name: "O desvio do exercicio 3 foi devolvido"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: ratings-v1
        namespace: bookinfo
      register: r_dep

    - name: "Consolidar"
      ansible.builtin.set_fact:
        _preserva: "{{ r_appset.resources | default([])
                       | selectattr('spec.syncPolicy.preserveResourcesOnDeletion','defined')
                       | selectattr('spec.syncPolicy.preserveResourcesOnDeletion','equalto',true) | list }}"
        _synced: "{{ r_apps.resources | default([]) | selectattr('status.sync.status','defined')
                     | selectattr('status.sync.status','equalto','Synced') | list }}"
        _replicas: "{{ r_dep.resources[0].spec.replicas | default(0) }}"

    - name: "Resultado"
      ansible.builtin.assert:
        that:
          - r_appset.resources | default([]) | length > 0
          - _preserva | length > 0
          - _synced | length > 0
          - _replicas | int == 1
        success_msg: |
          OK ApplicationSet presente — Application nasce de repositorio, nao de manifesto escrito a mao
          OK preserveResourcesOnDeletion ligado — apagar o Application nao derruba o servico vivo
          OK {{ _synced | length }} Application(s) Synced
          OK o desvio do exercicio 3 foi devolvido (ratings-v1 com 1 replica)
        fail_msg: |
          {{ 'OK  ' if r_appset.resources | default([]) | length > 0 else 'FALHOU' }} ApplicationSet em openshift-gitops
          {{ 'OK  ' if _preserva | length > 0 else 'FALHOU' }} preserveResourcesOnDeletion
          {{ 'OK  ' if _synced | length > 0 else 'FALHOU' }} alguma Application Synced
          {{ 'OK  ' if _replicas | int == 1 else 'FALHOU' }} ratings-v1 com {{ _replicas }} replica(s), esperado 1

          selfHeal esta DESLIGADO aqui: o Argo detecta o desvio e nao o desfaz.
          Quem devolve e voce:
            oc scale deploy/ratings-v1 -n bookinfo --replicas=1
