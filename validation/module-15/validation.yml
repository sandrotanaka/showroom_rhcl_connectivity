---
- name: "1.3 — os pods rodam a copia assinada"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Imagens em execucao
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: bookinfo
        field_selectors: [status.phase=Running]
      register: r_pods

    - name: Consolidar
      ansible.builtin.set_fact:
        _imagens: "{{ r_pods.resources | default([])
                      | map(attribute='spec.containers') | map('first')
                      | map(attribute='image') | list }}"
    - name: Consolidar (2)
      ansible.builtin.set_fact:
        _upstream: "{{ _imagens | select('search','registry.istio.io') | list }}"

    - name: Resultado
      ansible.builtin.assert:
        that:
          - _imagens | length > 0
          - _upstream | length == 0
        success_msg: |
          OK nenhuma imagem vem mais de registry.istio.io
          OK origem atual: {{ _imagens | map('regex_replace','/.*','') | unique | join(' ') }}
        fail_msg: |
          FALHOU {{ _upstream | length }} imagem(ns) ainda vem do upstream

          Descomente o bloco 'images:' em ~/rhcl/samples/bookinfo/kustomization.yaml
          e aponte para o Quay deste cluster, depois reaplique:
            cd ~/rhcl && SAMPLES=bookinfo bash scripts/provision.sh samples
