---
# Painel direito do Showroom (nookbag).
#
# 'type: showroom' NAO E OPCIONAL: sem ele o nookbag nao reconhece o arquivo e
# NENHUMA aba e montada -- o painel abre e nao funciona nada, sem erro na tela.
# Medido no cluster.
type: showroom

# 30% para o guia, 70% para o terminal e consoles.
default_width: 30
# Sobrevive ao F5: o participante nao perde a aba em que estava.
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # O TERMINAL VEM PRIMEIRO -- e de onde sai todo comando do dia.
  #
  # 'path: /terminal' e nao '/wetty': quem publica o terminal aqui e o nginx do
  # chart de deploy/, e ele proxia /terminal/ para o ttyd na 7681. O template do
  # nookbag usa /wetty porque o ambiente dele monta o terminal de outro jeito --
  # copiar o path de la deixa a aba muda.
  - name: Terminal
    path: /terminal/
    port: 443

  # O CONSOLE DO OPENSHIFT NAO PODE SER EMBUTIDO, e nao e defeito nosso.
  #
  # Medido: ele responde com X-Frame-Options: deny e CSP frame-ancestors 'none'.
  # A aba abriria vazia -- e uma aba que nunca funciona custa mais do que aba
  # nenhuma. Os modulos que precisam do console (Kiali, Traffic Graph, Traces,
  # Policy Topology) mandam abrir em outra janela, com o endereco descoberto por
  # 'oc whoami --show-console'.
  #
  # Para embutir seria preciso patchar o console do cluster para permitir
  # framing -- e o que o workload ocp4_workload_ocp_console_embed da RHDP faz.
  # Nao esta neste chart de proposito: mexe em configuracao de cluster para
  # ganhar uma aba.

  # As tres abaixo so respondem depois que a plataforma e a aplicacao do
  # laboratorio estiverem de pe. Antes disso a aba abre e nao carrega -- e isso
  # e estado do ambiente, nao defeito do guia.
  - name: Aplicação
    url: 'https://bookinfo.${DOMAIN}/productpage'

  - name: Grafana
    url: 'https://grafana-route-grafana.${DOMAIN}'

  - name: Developer Hub
    url: 'https://developer-hub.${DOMAIN}'
